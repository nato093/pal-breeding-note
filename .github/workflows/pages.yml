name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 古い版の GAS・画面との組み合わせのテスト（test/gas/legacy.js）は Git の履歴から古い版を取り出す。
          # 浅い複製だと取り出せず、CI ではテストが失敗する（黙って飛ばさない）ので、全部の履歴を取る
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: テスト（性能テストは含めない）
        run: npm test
      - name: パル画像の取得（失敗しても配信は続ける）
        continue-on-error: true
        run: |
          if [ -f scripts/fetch-icons.mjs ]; then
            node scripts/fetch-icons.mjs || echo "::warning::パル画像の取得に失敗しました。SVG アバターで配信します"
          fi
      - name: 版の書き込み（開いているページが新しい版に気づけるようにする）
        run: node scripts/build-release.mjs web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
